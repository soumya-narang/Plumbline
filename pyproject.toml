[project]
name = "plumbline"
version = "0.0.1"
description = "Supply-chain exposure agent on FalkorDB: path-backed verdicts and self-reopening decisions."
requires-python = ">=3.11"
dependencies = [
    "falkordb>=1.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=2.0",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001"]  # fixtures skip on any connection failure by design
